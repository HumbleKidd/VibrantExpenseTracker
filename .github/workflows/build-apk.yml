name: Build and Release APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Vibrant Expense Tracker v1.0.0
          body: |
            Initial release of the vibrant, colorful expense tracker app for Android.
            
            Features:
            - Vibrant Material Design UI with colorful category cards
            - Quick add via floating action button and bottom sheet
            - Swipe-friendly expense list with delete
            - Total spent summary in JMD
            - Category filters and icons
            - Mobile-native gestures and popups
            
            Download the APK below to test!
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
